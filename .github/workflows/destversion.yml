name: WeChat Version Collector

on:
  schedule:
    - cron: '0 7 * * *'  # 每天 UTC 7:00 运行
  workflow_dispatch:
    inputs:
      platform:
        description: '选择平台 (all/mac/windows)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - windows
      download_link:
        description: '手动指定下载链接（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  checks: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

jobs:
  save_new_wechat:
    runs-on: macos-13
    env:
      GH_TOKEN: ${{ github.token }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Cache Homebrew packages
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/destversion.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-
      
      - name: Setup environment
        run: |
          chmod +x scripts/*.sh
          brew update
      
      - name: Check Windows version
        if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' || github.event.inputs.platform == ''
        run: |
          ./scripts/destVersionForWin.sh "${{ github.event.inputs.download_link }}"
        continue-on-error: false
      
      - name: Check Mac version
        if: github.event.inputs.platform == 'mac' || github.event.inputs.platform == 'all' || github.event.inputs.platform == ''
        run: |
          ./scripts/destVersionForMac.sh "${{ github.event.inputs.download_link }}"
        continue-on-error: false
      
      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: error-logs
          path: |
            WeChatWin/temp/*.log
            WeChatMac/temp/*.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -rf WeChatWin/temp WeChatMac/temp
          brew cleanup
